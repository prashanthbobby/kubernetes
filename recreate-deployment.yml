# this is for the new deployment stratagy which we used to update our application to newer version.
# Old pod is deleted first, then new pod is created
# downtime
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moupra-recreate-deploy
  namespace: pns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moupra
  template: # pod template
    metadata:
      labels:
        app: moupra
    spec:
      containers:
      - name: moupra1c
        image: prashanth1316/moupra:1
        ports:
        - containerPort: 80