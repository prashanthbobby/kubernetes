apiVersion: networkpolicy.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pnpdb
  namespace: pns
spec:
  podSelector:
    matchLabels:
      app: pod1
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - ipBlock:
          cidr: 172.10.0.0/16
          except:
            - 172.10.1.0/24
        namespaceSelector:
          matchLabels:
            team: test-team
        podSelector:
          matchLabels:
            app: pod2
      ports:
        - protocol: TCP
          port: 27017
  egress:
    - to:
        - ipBlock:
          cidr: 10.10.0.0/16
      ports:
        - protocol: TCP
          port: 5978