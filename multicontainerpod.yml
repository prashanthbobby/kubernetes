apiVersion: v1
kind: Pod
metadata:
  name: moupra
  namespace: pns
  labels:
    app: moupra
spec:
  containers:
  - name: moupra1c
    image: prashanth1316/moupra:1
    ports:
    - containerPort: 80
  - name: moupra2c
    image: prashanth1316/moupra:3
    ports:
    - containerPort: 81

---
apiVersion: v1
kind: Service
metadata:
  name: psvc
  namespace: pns
spec:
  type: ClusterIP
  selector:
    app: moupra
  ports:
  - port: 80
    targetPort: 80
    name: v1
  - port: 81
    targetPort: 81
    name: v2