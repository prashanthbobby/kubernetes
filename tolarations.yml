apiVersion: v1
kind: Pod
metadata: 
  name: moupra
  namespace: pns
  labels:
    app: moupra
spec:
  containers:
    - name: moupracontainer
      image: prashanth1316/moupra:1
      ports:
      - containerPort: 80
      resources:
        requests:
          cpu: "250m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
  tolarations:
  - key: node
    value: nodeOne
    operator: Equal
    effect: NoSchedule

# To create a taint use command
# kubectl taint nodes <nodename><key>=<value>:<effect>
# kubectl taint nodes <nodename>node=nodeOne:NoSchedule
