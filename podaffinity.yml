apiVersion: v1
kind: Pod
metadata: 
  name: moupra-affinity
  namespace: pns
  labels:
    app: moupra
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution: # here it will check for the key=value (node=nodeworker) and it should match the key value else pod wont get started.
      - labelSelector:
          matchExpressions:
          - key: app # key of your node label
            operator: In
            values:
              - moupra
        topologyKey: kubernetes.io/hostname
  containers:
    - name: moupracontainer
      image: prashanth1316/moupra:1
      ports:
      - containerPort: 80
      resources:
        requests:
          cpu: "250m"
          memory: "64Mi"
        limits:
          cpu: "500m"
          memory: "128Mi"
