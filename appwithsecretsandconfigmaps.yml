apiVersion: v1
kind: Service
metadata:
  name: psvc
spec:
  selector:
    app: moupra
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: p-deploy
  namespace: pns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: moupra
  template:
    metadata:
      labels:
        app: moupra
    spec:
      containers:
      - name: moupra1c
        image: prashanth1316/moupra:1
        ports:
        - containerPort: 80
        env:
        # From ConfigMap
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: pcm
              key: APP_NAME

        - name: USER_NAME
          valueFrom:
            configMapKeyRef:
              name: pcm
              key: USER_NAME

        # From Secret
        - name: APP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: psecret
              key: APP_PASSWORD

        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: psecret
              key: API_KEY